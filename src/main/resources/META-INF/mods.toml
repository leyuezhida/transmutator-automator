modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
# Display name comes from gradle/mod_text.properties: pure ASCII with
# \uXXXX escapes, because Groovy reads .properties with the platform
# encoding (GBK on this machine) and would mangle Chinese written here.
displayName="${mod_display_name}"
# Mod list icon, 128x128
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_summary}'''

# Client-side only: must not be installed on a dedicated server.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# The transmutation table is provided by Alex's Mobs.
[[dependencies.${mod_id}]]
    modId="alexsmobs"
    mandatory=true
    versionRange="[1.22,)"
    ordering="AFTER"
    side="CLIENT"
