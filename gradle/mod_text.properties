# Mod display name and summary (pure ASCII, Chinese written as escapes).
#
# Not in gradle.properties because Groovy reads .properties with the JVM
# default encoding, which is GBK on this machine (see -Dfile.encoding=GBK in
# the daemon log). Chinese stored there is read as mojibake and lands in
# mods.toml double-encoded, so the game shows garbage.
# Hit on 2026-10-05 when renaming the mod to a Chinese name.
#
# The escapes below are read by java.util.Properties, which resolves them
# regardless of platform. Do NOT write that escape prefix in a comment
# here: Properties resolves it in comments too, and the text gets glued
# onto the preceding value. That silently corrupted mods.toml's version
# field as "1.0.1XXXX escapes, because ...".
mod_display_name=\u5B17\u53D8\u53F0\uFF1A\u5927\u53D8
mod_display_name_en=Transmutator Automator
mod_summary_cn=\u81EA\u52A8\u5B17\u53D8\u52A9\u624B\uFF1A\u4E00\u76F4\u5B17\u53D8\u76F4\u5230\u51FA\u73B0\u6807\u8BB0\u7269\u54C1\u3002
mod_summary_en=Auto-transmute until a target appears.
